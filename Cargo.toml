[package]
name = "svird"
version = "0.1.0"
description = "Crate that allows to run a right version of selenium driver using selenium manager"
authors = ["Henri Joel SEDJAME <sedhjodev@gmail.com>"]
keywords = ["selenium", "selenium-manager", "web-driver", "rust", "automation"]
edition = "2024"
license = "MIT"
readme = "README.md"


[dependencies]
thirtyfour = "0.36.1"
tokio = {version = "1.50.0", features = ["full"]}
anyhow = "1.0.102"
serde_json = "1.0.149"
log = "0.4.29"
env_logger = "0.11.10"

selenium-manager = { git = "https://github.com/SeleniumHQ/selenium.git", branch = "trunk" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
