[package]
name = "svird"
version = "0.1.0"
description = "Crate that allows to run a right version of selenium driver using selenium manager"
authors = ["Henri Joel SEDJAME <sedhjodev@gmail.com>"]
keywords = ["selenium", "selenium-manager", "web-driver", "rust", "automation"]
edition = "2024"
license = "MIT"
readme = "README.md"

[[test]]
name = "svird_tests"
path = "src/tests/tests.rs"

[dev-dependencies]
rstest = "0.26.1"

[dependencies]
thirtyfour = "0.36.1"
tokio = {version = "1.50.0", features = ["full"]}
regex =  "1.12.3"
thiserror = "2.0.18"
serde_json = "1.0.149"
log = "0.4.29"
env_logger = "0.11.10"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
